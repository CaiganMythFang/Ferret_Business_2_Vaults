
["Developer Settings"]
	#Don't recommend turning on unless asked, enables debug messages for development. (default: false)
	enableDebugMode = false

["Gameplay Settings"]
	#Controls whether Mote of Purity, Sanctity, and Clarity should work in the Crystal Workbench. (default: false)
	enableMoteRecipes = false
	#Controls whether or not wandering wisps should spawn (default: true)
	disableWanderingWispSpawning = true
	#Whether Better Combat should be disabled for weapons or not (note: this is a client-side setting, don't change on servers) (default: false)
	weaponsShouldntBeBetter = false
	#How much a difference in levels should be allowed for Soul Flames before not raising stacks (default: 3)
	soulFlameLevelAllowance = 3
	#The max capacity that can be added to a tool with Resonating Reinforcements. (default: 20)
	resonatingReinforcementMaxCapacityAdded = 20

