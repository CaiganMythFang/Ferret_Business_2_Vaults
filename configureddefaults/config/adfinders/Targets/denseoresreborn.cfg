mineral_finder {
    # List of all blocks the finder should be looking for.
    # The format is <unitId>, <colorARGB> [, <groupName>]
    # 
    # Id is a basic unit (block or item) identifier in <modId:unitName:meta> format.
    # ModId can be omitted for vanilla items. Meta can be omitted too if it equals 0.
    # UnitName must be lowercase, words separated by '_', words order - from private to common (example: black_iron_ore).
    # Use '*' char or '[]' as meta value to specify all possible values (all block states).
    # To define multiple block states, you can use block properties. The format is <modId:blockName:[prop1=value1, prop2=value2]>
    # Also you may use tags. The format is <#modId:tagPath> (example: #forge:ores/copper).
    # 
    # Color in ARGB (Alpha, Red, Green, Blue) hex format (0xaarrggbb)
    # 
    # Group name is necessary for having one needle for each ore group(one needle for all copper ores, one for all gold ores, etc.)
    # If not set then unitName will be used.
    # 
    S:targets <
        denseoresreborn:dense_lapis_lazuli_ore, 0xff0000ff, lapis
        denseoresreborn:dense_deepslate_lapis_lazuli_ore, 0xff0000ff, lapis
        denseoresreborn:dense_diamond_ore, 0xff3de0e5, diamond
        denseoresreborn:dense_deepslate_diamond_ore, 0xff3de0e5, diamond
        denseoresreborn:dense_emerald_ore, 0xff08aa2f, emerald
        denseoresreborn:dense_deepslate_emerald_ore, 0xff08aa2f, emerald
        denseoresreborn:dense_quartz_ore, 0xfff3f0e6, quartz
        denseoresreborn:dense_deepslate_quartz_ore, 0xfff3f0e6, quartz
        denseoresreborn:dense_nether_gold_ore, 0xffffd700, gold
        denseoresreborn:dense_deepslate_nether_gold_ore, 0xffffd700, gold
        denseoresreborn:dense_iron_ore, 0xffdeb887, iron
        denseoresreborn:dense_deepslate_iron_ore, 0xffdeb887, iron
        denseoresreborn:dense_copper_ore, 0xffc56544, copper
        denseoresreborn:dense_deepslate_copper_ore, 0xffc56544, copper
        denseoresreborn:dense_gold_ore, 0xffffd700, gold
        denseoresreborn:dense_deepslate_gold_ore, 0xffffd700, gold
        denseoresreborn:dense_ancient_debris_ore, 0xff7c5e57, ancient_debris
        denseoresreborn:dense_deepslate_ancient_debris_ore, 0xff7c5e57, ancient_debris
        denseoresreborn:dense_coal_ore, 0xff000000, coal
        denseoresreborn:dense_deepslate_coal_ore, 0xff000000, coal
        denseoresreborn:dense_redstone_ore:*, 0xffff0000, redstone
        denseoresreborn:dense_deepslate_redstone_ore:*, 0xffff0000, redstone
     >
}


